[project]
name = "fipy-wrroc-workflow"
version = "0.1.0"
description = "FiPy phase-field benchmarks with automated RO-Crate provenance"
authors = [
    { name = "Daniel Wheeler", email = "daniel.wheeler2@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    # Simulation Stack
    "fipy>=3.4.2",
    "scipy>=1.11.0",
    "pyyaml>=6.0.1",
    
    # Metadata/Provenance Stack
    "rocrate>=0.11.0",
    "frictionless>=5.18.0",
    "toolz>=1.0.0"
]

# This tells uv NOT to attempt building the local directory as a wheel
[tool.uv]
package = false



[tool.rocrate.authors]
# Define domain-specific provenance that standard pyproject.toml omits
DanielWheeler = { name = "Daniel Wheeler", orcid = "https://orcid.org/0000-0002-2653-7418", affiliation = "National Institute of Standards and Technology" }

[tool.rocrate.license]
name = "MIT License"
identifier = "https://spdx.org/licenses/MIT.html"
